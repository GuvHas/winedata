name: HACS & integration validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so an upstream markup change at Munskänkarna surfaces on its own
    # rather than the first time someone opens their dashboard.
    - cron: "0 6 * * 1"

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests
      - run: python -m pytest -q
