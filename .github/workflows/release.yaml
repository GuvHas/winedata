name: Release

# HACS decides between showing a version and showing a commit by asking
# GitHub's releases API (repos.releases.list). That endpoint returns Release
# objects only — a bare git tag is not enough, and draft or pre-release
# entries are skipped. So publishing a real Release is what makes HACS offer
# "1.0.2" instead of a commit SHA.
#
# Run manually: Actions -> Release -> Run workflow.
# The version comes from custom_components/munskankarna/manifest.json, so the
# tag, the Release and the manifest can never disagree.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from the manifest
        id: manifest
        run: |
          version=$(python -c "import json;print(json.load(open('custom_components/munskankarna/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      - name: Verify the tag matches the manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pushed="${GITHUB_REF#refs/tags/}"
          expected="${{ steps.manifest.outputs.tag }}"
          if [ "$pushed" != "$expected" ]; then
            echo "::error::Tag $pushed does not match manifest version $expected"
            exit 1
          fi

      - name: Create the tag if it does not exist
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; reusing it."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Munskänkarna $TAG"
            git push origin "$TAG"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already published."
            exit 0
          fi
          # --latest and no --draft/--prerelease: HACS skips drafts and
          # pre-releases when deciding which versions to offer.
          gh release create "$TAG" \
            --title "Munskänkarna $VERSION" \
            --generate-notes \
            --latest
          echo "Published release $TAG"
