[project]
name = "munskankarna-ha"
version = "1.0.0"
description = "Home Assistant integration for Munskänkarna wine reviews"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# pytest only collects test_*.py, so the TypeScript suite in the same
# directory (tests/*.test.ts) is untouched by this config.
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
