# Munskänkarna — Lovelace dashboard
#
# Four views over the integration's data, including the retained release
# archive:
#
#   Veckans viner   mobile-first — this week's picks, one tap to Systembolaget
#   Alla provningar desktop — full detail per tasting type, current release
#   Arkiv           every retained release, grouped by publication date
#   Höjdpunkter     the best wines and every Fynd across the whole window
#
# ---------------------------------------------------------------------------
# REQUIREMENTS
# ---------------------------------------------------------------------------
#
#   Home Assistant  2024.12 or newer (the `sections` view type)
#   Integration     Munskänkarna 1.1.0 or newer, for the archive views —
#                   they read sensor.munskankarna_history, added in 1.1.0.
#                   1.1.3 or newer if Home Assistant calls these entities
#                   unknown: it renames ids left prefixed by a renamed device
#                   (sensor.virtual_munskankarna_...) back to the ids below,
#                   and offers the rest under Settings -> Repairs as a
#                   one-click rename.
#   HACS frontend   NONE. Every card in the active configuration below is
#                   built into Home Assistant: markdown, glance, entities,
#                   heading, button. Nothing to install.
#
# Two optional HACS cards (flex-table-card, auto-entities) are sketched at the
# very bottom, commented out. They are genuine upgrades for the archive views,
# and the dashboard is complete without them.
#
# ---------------------------------------------------------------------------
# HOW TO INSTALL
# ---------------------------------------------------------------------------
#
#   1. Settings -> Dashboards -> + Add Dashboard -> New dashboard from scratch
#   2. Open it, then the pencil (top right) -> three dots -> "Raw
#      configuration editor"
#   3. Select all, paste this file over it, Save
#
# Pasting into an existing dashboard replaces its entire configuration, so
# start a new one unless you mean to.
#
# Entity ids assume a single config entry and default naming. Verify yours in
# Developer Tools -> States (filter on "munskankarna"). With two config
# entries the second set is suffixed (`..._2`), so adjust accordingly.
#
# ---------------------------------------------------------------------------
# A NOTE ON THE RECORDER
# ---------------------------------------------------------------------------
#
# The archive views read sensor.munskankarna_history, which carries every
# retained release with its wines. That is the one entity in this integration
# with a large attribute payload. The archive itself lives in `.storage`, not
# the recorder, so nothing here is required — but if you would rather the
# payload never reached your database at all:
#
#     recorder:
#       exclude:
#         entities:
#           - sensor.munskankarna_history
#
# The per-tasting-type sensors stay small either way, so excluding this one
# costs you the archive views and nothing else.
#
# ---------------------------------------------------------------------------
# CONVENTIONS USED THROUGHOUT
# ---------------------------------------------------------------------------
#
# * Responsiveness is handled by the `sections` view type: `max_columns` is an
#   upper bound, and sections reflow to a single column on a phone. The
#   mobile-first views keep their tables to three or four columns so they stay
#   readable at that width; the desktop views use more.
#
# * Every optional field is guarded with `is not none`. That is not
#   decoration: a markdown card that raises renders as a red error box, so one
#   wine with no price would take out an entire table rather than its own row.
#   Missing values show an em dash — an empty cell reads as "0 kr".
#
# * Anything sorted carries an explicit `rank` (the score, or -1 when absent).
#   Jinja's sort() raises comparing None to a number, and sorting happens
#   before any display guard can help.
#
# * Wines in the *archive* views carry a leaner set of fields than wines in
#   the current-release views: name, vintage, producer, score, value, price,
#   price_per_litre and url. `url` is already the product link falling back to
#   the review page, so there is no `review_url` to check there. The archive
#   spans every retained release of every tracked type, and the full field set
#   put it over Home Assistant's 16 KiB recorder limit.
#
# * The history sensor publishes `wines_per_release` and `truncated`. When the
#   archive is too large for one attribute payload, the wine lists are trimmed
#   uniformly and those two attributes say so — every release always keeps its
#   date, count and link.

views:
  # =======================================================================
  # MOBILE — the companion-app view: this week's picks, one thumb-reach tap
  # to the product page on Systembolaget.
  # =======================================================================
  - title: Veckans viner
    path: viner
    icon: mdi:glass-wine
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Veckans fynd
            heading_style: title
            icon: mdi:tag-heart

          # Compact status row: what landed, when, and how much of it.
          - type: glance
            entities:
              - entity: sensor.munskankarna_latest_release
                name: Släppt
              - entity: sensor.munskankarna_fynd
                name: Fynd
              - entity: sensor.munskankarna_wines_tested
                name: Testade
            state_color: false

          # The headline pick. `state_color: false` keeps the score readable.
          - type: markdown
            content: >-
              {% set s = 'sensor.munskankarna_top_pick' %}

              {% if states(s) not in ['unknown','unavailable'] %}

              ## 🏆 {{ states(s) }}

              **{% if state_attr(s,'score') is not none %}{{
              state_attr(s,'score') }}{% else %}—{% endif %}/20** ·
              {{ state_attr(s,'producer') or '—' }} ·
              {% if state_attr(s,'price') is not none %}{{ state_attr(s,'price')
              | round(0) }} kr{% else %}—{% endif %}

              {% if state_attr(s,'url') %}[Öppna på
              Systembolaget]({{ state_attr(s,'url') }}) ·
              art. {{ state_attr(s,'article_number') }}{% endif %}

              {% else %}

              _Ingen data ännu._

              {% endif %}

          # Tillfälligt sortiment — the weekly release, as a tap-friendly list.
          # Rendered as a markdown table so it stays legible at 390 px.
          - type: markdown
            content: >-
              {% set s = 'sensor.munskankarna_tillfalligt_sortiment' %}

              {% set wines = state_attr(s,'wines') or [] %}

              ### {{ state_attr(s,'release_title') or 'Tillfälligt sortiment' }}

              {% if wines %}

              | | Vin | Pris |

              |---:|---|---:|

              {% for w in wines -%}

              | **{% if w.score is not none %}{{ w.score }}{% else %}—{% endif
              %}** | [{{ w.name }}{% if w.vintage %} {{ w.vintage }}{% endif
              %}]({{ w.url or w.review_url }}){% if w.value == 'fynd' %} ⭐{%
              endif %} | {% if w.price is not none %}{{ w.price | round(0) }}
              kr{% else %}—{% endif %} |

              {% endfor %}

              _{{ state_attr(s,'release_date') }} ·
              {{ states(s) }} viner totalt_

              {% else %}

              _Inga viner i den här provningen._

              {% endif %}

  # =======================================================================
  # DESKTOP — denser, multi-column, with full detail per wine.
  # =======================================================================
  - title: Alla provningar
    path: provningar
    icon: mdi:table
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Status
          - type: entities
            entities:
              - entity: sensor.munskankarna_latest_release
                name: Senaste släpp
                icon: mdi:calendar-star
              - entity: sensor.munskankarna_wines_tested
                name: Viner testade
              - entity: sensor.munskankarna_fynd
                name: Fynd totalt
              - type: divider
              - type: button
                name: Uppdatera nu
                icon: mdi:refresh
                tap_action:
                  action: perform-action
                  perform_action: munskankarna.trigger_sync
                  data: {}

      # One column per tracked tasting type. Each renders the full attribute
      # set, which is what the desktop width affords.
      - type: grid
        cards:
          - type: heading
            heading: Tillfälligt sortiment
          - type: markdown
            content: >-
              {% set s = 'sensor.munskankarna_tillfalligt_sortiment' %}

              {% set wines = state_attr(s,'wines') or [] %}

              {% if wines %}

              | Betyg | Vin | Ursprung | Pris | kr/l | |

              |---:|---|---|---:|---:|---|

              {% for w in wines -%}

              | **{% if w.score is not none %}{{ w.score }}{% else %}—{% endif
              %}** | {{ w.name }}{% if w.vintage %} {{ w.vintage }}{% endif
              %}<br><sub>{{ w.producer or '—' }}</sub> | {{ w.country or '—'
              }}{% if w.region %}, {{ w.region }}{% endif %} | {% if w.price is
              not none %}{{ w.price | round(0) }} kr{% else %}—{% endif %} | {%
              if w.price_per_litre is not none %}{{ w.price_per_litre | round(0)
              }}{% else %}—{% endif %} | {% if w.url %}[🔗]({{ w.url }}){% endif
              %} |

              {% endfor %}

              {% else %}_Ingen data._{% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Hitlistan
          - type: markdown
            content: >-
              {% set s = 'sensor.munskankarna_hitlista' %}

              {% set wines = state_attr(s,'wines') or [] %}

              {% if wines %}

              | Betyg | Vin | Pris | |

              |---:|---|---:|---|

              {% for w in wines -%}

              | **{% if w.score is not none %}{{ w.score }}{% else %}—{% endif
              %}** | {{ w.name }}<br><sub>{{ w.producer or '—' }}</sub> | {% if
              w.price is not none %}{{ w.price | round(0) }} kr{% else %}—{%
              endif %} | {% if w.url %}[🔗]({{ w.url }}){% endif %} |

              {% endfor %}

              {% else %}_Ingen data._{% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Endast fynd
            icon: mdi:tag-heart
          - type: markdown
            content: >-
              {% set wines = state_attr('sensor.munskankarna_fynd','wines') or []
              %}

              {% if wines %}

              | Betyg | Vin | Pris | |

              |---:|---|---:|---|

              {% for w in wines -%}

              | **{% if w.score is not none %}{{ w.score }}{% else %}—{% endif
              %}** | {{ w.name }} | {% if w.price is not none %}{{ w.price |
              round(0) }} kr{% else %}—{% endif %} | {% if w.url %}[🔗]({{ w.url
              }}){% endif %} |

              {% endfor %}

              {% else %}_Inga fynd den här veckan._{% endif %}

  # =======================================================================
  # ARCHIVE — every retained release, grouped by publication date.
  #
  # Reads sensor.munskankarna_history, which carries the whole archive on one
  # entity. Grouping by date rather than by tasting type is deliberate: the
  # question a reader has is "what came out this week", and two categories
  # published on the same day belong together.
  # =======================================================================
  - title: Arkiv
    path: arkiv
    icon: mdi:calendar-clock
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Sparade släpp
            heading_style: title
            icon: mdi:calendar-clock

          - type: glance
            show_name: true
            show_state: true
            entities:
              - entity: sensor.munskankarna_history
                name: Släpp sparade
              - entity: sensor.munskankarna_fynd_history
                name: Fynd i arkivet
              - entity: sensor.munskankarna_latest_release
                name: Senaste släpp

          # A one-line-per-release index, so the archive can be skimmed before
          # scrolling into it.
          - type: markdown
            content: >-
              {% set s = 'sensor.munskankarna_history' %}

              {% set releases = state_attr(s,'releases') or [] %}

              {% if releases %}

              | Datum | Provning | Viner | Bäst |

              |---|---|---:|---:|

              {% for r in releases -%}

              {% set scores = r.wines | map(attribute='score')
              | select('ne', None) | list %}| {{ r.date or '—' }} |
              {{ r.kind_label }} | {{ r.wine_count }} | {% if scores %}**{{
              scores | max }}**{% else %}—{% endif %} |

              {% endfor %}

              _{{ releases | length }} släpp ·
              {{ state_attr(s,'retained_per_kind') }} sparas per provningstyp_

              {% if state_attr(s,'truncated') %}

              _⚠️ Visar de {{ state_attr(s,'wines_per_release') }} bästa vinerna
              per släpp. Home Assistant tillåter högst 16 KiB attribut per
              entitet, så listorna kortas för att få plats — hela arkivet finns
              kvar i integrationen. Spåra färre provningstyper eller spara färre
              släpp för att se fler per släpp._

              {% endif %}

              {% else %}

              _Inget arkiv ännu. Det fylls på vid nästa uppdatering._

              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Vecka för vecka
            heading_style: title

          # Grouped by date: one heading per publication date, with every
          # release published that day beneath it.
          - type: markdown
            content: >-
              {% set releases = state_attr('sensor.munskankarna_history','releases')
              or [] %}

              {% set ns = namespace(dates=[]) %}

              {% for r in releases %}{% if r.date and r.date not in ns.dates %}{%
              set ns.dates = ns.dates + [r.date] %}{% endif %}{% endfor %}

              {% if releases %}

              {% for d in ns.dates %}

              ## {{ d }}

              {% for r in releases if r.date == d %}

              **{{ r.kind_label }}** — {{ r.wine_count }} vin{% if r.wine_count
              != 1 %}er{% endif %}{% if r.stale %} · ⚠️ visar tidigare
              hämtning{% endif %}

              {% if r.wines %}

              | Betyg | Vin | Pris | |

              |---:|---|---:|---|

              {% for w in r.wines -%}

              | **{% if w.score is not none %}{{ w.score }}{% else %}—{% endif
              %}** | {{ w.name }}{% if w.value == 'fynd' %} ⭐{% endif %} | {% if
              w.price is not none %}{{ w.price | round(0) }} kr{% else %}—{%
              endif %} | {% if w.url %}[🔗]({{ w.url }}){% endif %} |

              {% endfor %}

              {% else %}

              _Inga viner i det här släppet._

              {% endif %}

              {% endfor %}

              {% endfor %}

              {% set undated = releases | rejectattr('date') | list %}

              {% if undated %}

              ## Utan datum

              {% for r in undated %}

              **{{ r.kind_label }}** — {{ r.wine_count }} vin{% if r.wine_count
              != 1 %}er{% endif %}

              {% endfor %}

              {% endif %}

              {% else %}

              _Inget arkiv ännu._

              {% endif %}

  # =======================================================================
  # HIGHLIGHTS — the best of the whole retained window, ignoring which week
  # a wine came from. This is the "what should I actually buy" view.
  # =======================================================================
  - title: Höjdpunkter
    path: hojdpunkter
    icon: mdi:trophy
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Bäst i arkivet
            heading_style: title
            icon: mdi:trophy

          # Top ten by score across every retained release.
          - type: markdown
            content: >-
              {% set releases = state_attr('sensor.munskankarna_history','releases')
              or [] %}

              {% set ns = namespace(rows=[]) %}

              {% for r in releases %}{% for w in r.wines %}{% set ns.rows =
              ns.rows + [dict(w, when=r.date, kind=r.kind_label,
              rank=(w.score if w.score is not none else -1))] %}{% endfor %}{%
              endfor %}

              {% set rows = (ns.rows | sort(attribute='rank', reverse=true))[:10] %}

              {% if rows %}

              | Betyg | Vin | Provning | Datum | Pris | |

              |---:|---|---|---|---:|---|

              {% for w in rows -%}

              | **{% if w.score is not none %}{{ w.score }}{% else %}—{% endif
              %}** | {{ w.name }}{% if w.value == 'fynd' %} ⭐{% endif
              %}<br><sub>{{ w.producer or '—' }}</sub> | {{ w.kind }} |
              {{ w.when or '—' }} | {% if w.price is not none %}{{ w.price |
              round(0) }} kr{% else %}—{% endif %} | {% if w.url %}[🔗]({{
              w.url }}){% endif %} |

              {% endfor %}

              {% if state_attr('sensor.munskankarna_history','truncated') %}

              _Rankat bland de {{
              state_attr('sensor.munskankarna_history','wines_per_release') }}
              bästa vinerna per släpp, inte hela arkivet._

              {% endif %}

              {% else %}

              _Inget arkiv ännu._

              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Alla fynd i fönstret
            heading_style: title
            icon: mdi:tag-heart

          # Every Fynd across the window, best first.
          - type: markdown
            content: >-
              {% set releases = state_attr('sensor.munskankarna_history','releases')
              or [] %}

              {% set ns = namespace(rows=[]) %}

              {% for r in releases %}{% for w in r.wines %}{% if w.value ==
              'fynd' %}{% set ns.rows = ns.rows + [dict(w, when=r.date,
              kind=r.kind_label, rank=(w.score if w.score is not none else -1))]
              %}{% endif %}{% endfor %}{% endfor %}

              {% set rows = ns.rows | sort(attribute='rank', reverse=true) %}

              {% if rows %}

              | Betyg | Vin | Datum | Pris | kr/l | |

              |---:|---|---|---:|---:|---|

              {% for w in rows -%}

              | **{% if w.score is not none %}{{ w.score }}{% else %}—{% endif
              %}** | {{ w.name }}<br><sub>{{ w.kind }}</sub> | {{ w.when or '—'
              }} | {% if w.price is not none %}{{ w.price | round(0) }} kr{%
              else %}—{% endif %} | {% if w.price_per_litre is not none %}{{
              w.price_per_litre | round(0) }}{% else %}—{% endif %} | {% if
              w.url %}[🔗]({{ w.url }}){% endif %} |

              {% endfor %}

              {% set total = states('sensor.munskankarna_fynd_history') | int(0) %}

              {% if rows | length < total %}

              _Visar {{ rows | length }} av {{ total }} fynd i arkivet. Resten
              ligger utanför de {{
              state_attr('sensor.munskankarna_history','wines_per_release') }}
              viner per släpp som får plats i attributen (16 KiB)._

              {% else %}

              _{{ rows | length }} fynd i arkivet_

              {% endif %}

              {% else %}

              _Inga fynd i arkivet ännu._

              {% endif %}

          - type: markdown
            content: >-
              {% set s = 'sensor.munskankarna_fynd_history' %}

              {% set per = state_attr(s,'per_kind') or {} %}

              {% set labels = state_attr(s,'kind_labels') or {} %}

              {% if per %}

              | Provningstyp | Fynd |

              |---|---:|

              {% for kind, count in per.items() -%}

              | {{ labels.get(kind, kind) }} | **{{ count }}** |

              {% endfor %}

              {% endif %}

              _Arkivet sparar de senaste släppen per provningstyp.
              Provningstyperna publiceras olika ofta — Tillfälligt sortiment
              varje vecka, Hitlistan varannan, Fast sortiment och Lokalt och
              småskaligt ungefär månadsvis — så tre släpp är ungefär tre veckor
              för den första och snarare tre månader för de andra. Ändra djupet
              under Inställningar -> Enheter och tjänster -> Munskänkarna ->
              Konfigurera._

# ==========================================================================
# OPTIONAL: custom cards (install via HACS -> Frontend)
# ==========================================================================
#
# flex-table-card renders attribute lists as a real sortable table and is a
# better fit than Markdown on desktop:
#
#   - type: custom:flex-table-card
#     title: Tillfälligt sortiment
#     entities:
#       include: sensor.munskankarna_tillfalligt_sortiment
#     sort_by: score-
#     columns:
#       - name: Betyg
#         data: wines
#         modify: x.score
#       - name: Vin
#         data: wines
#         modify: x.name + (x.vintage ? ' ' + x.vintage : '')
#       - name: Pris
#         data: wines
#         modify: x.price + ' kr'
#       - name: Systembolaget
#         data: wines
#         modify: >-
#           x.url ? '<a href="' + x.url + '" target="_blank">' +
#           x.article_number + '</a>' : '—'
#
# auto-entities is NOT a good fit here: the wines live inside one entity's
# attributes rather than as separate entities, so there is nothing for it to
# glob over. Use flex-table-card or Markdown instead.
